<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <button onclick="testCORS()">Test CORS</button>
    <pre id="result"></pre>

    <script>
        async function testCORS() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing CORS...';
            
            try {
                // Test OPTIONS preflight
                resultEl.textContent += '\n\n1. Testing OPTIONS preflight...';
                const optionsResponse = await fetch('http://localhost:8000/auth/login', {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': 'http://localhost:3000',
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'content-type'
                    }
                });
                resultEl.textContent += '\nOPTIONS Status: ' + optionsResponse.status;
                resultEl.textContent += '\nOPTIONS Headers:';
                for (let [key, value] of optionsResponse.headers.entries()) {
                    if (key.includes('access-control')) {
                        resultEl.textContent += `\n  ${key}: ${value}`;
                    }
                }
                
                // Test actual POST
                resultEl.textContent += '\n\n2. Testing POST request...';
                const response = await fetch('http://localhost:8000/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'test'
                    })
                });
                
                resultEl.textContent += '\nPOST Status: ' + response.status;
                const data = await response.json();
                resultEl.textContent += '\nResponse: ' + JSON.stringify(data, null, 2);
                resultEl.style.color = 'green';
            } catch (error) {
                resultEl.textContent += '\n\nERROR: ' + error.message;
                resultEl.style.color = 'red';
            }
        }
    </script>
</body>
</html>
